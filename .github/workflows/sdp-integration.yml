          octaneClientId: GitHubActions_7ypjoxvp8n9ket5yxky03z3md
          octaneClientSecret: R?-9(Xd11Z8eEc3E?tN4B
          githubToken: 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
          serverBaseUrl: 'https://github.com/coloexpress3/CSDP_Demo'
